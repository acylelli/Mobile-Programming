name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android 빌드·단위 테스트·Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # 앱 버전(versionCode)을 git 커밋 수로 정하므로 이력을 모두 받는다.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 캐시와 wrapper 검증
      - uses: gradle/actions/setup-gradle@v4

      # local.properties 가 없으면 transitProvider=fake 로 빌드된다(API 키 불필요).
      - name: Build, test, lint
        run: ./gradlew :shared:jvmTest :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --console=plain

      - name: 테스트·Lint 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            shared/build/reports/tests/
          retention-days: 7

  shared-ios:
    name: 공용 계산 모듈 iOS 시뮬레이터 테스트
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # 안드로이드·iOS 가 함께 쓰는 알람 계산을 iOS 시뮬레이터(Kotlin/Native)에서도 같은 테스트로 검증한다.
      - name: iOS 시뮬레이터 테스트
        run: ./gradlew :shared:iosSimulatorArm64Test --console=plain

  server:
    name: Proxy 서버 타입 검사·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      # 외부 API 를 호출하지 않으므로 키 없이 실행된다.
      - run: npm test
